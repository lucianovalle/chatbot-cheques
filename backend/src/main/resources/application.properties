server.port=8081

# A senha fica em application-local.properties, que não entra no Git.
spring.profiles.active=local

# O Flyway cria e carrega as tabelas. O Hibernate só confere se elas batem com as entidades.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

server.error.include-message=always

chat.ollama.base-url=http://localhost:11434
chat.ollama.model-name=llama3.2
chat.ollama.embedding-model=nomic-embed-text
chat.ollama.timeout-seconds=240
chat.docs.path=../docs
